# Builds every dynamic image of the profile README inside this repository,
# then publishes them to the `output` branch. No public Vercel instance is
# involved, so cards never hit shared rate limits or 503 errors.
#
# Optional: add a repository secret GH_STATS_TOKEN (classic PAT, scopes:
# repo + read:user) to count commits from private repositories like Sawn.
# Without it the cards use GITHUB_TOKEN and show public activity only.

name: Profile assets

on:
  schedule:
    - cron: "17 3 * * *" # daily, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: true

env:
  # One palette for every card: GitHub dark surface, violet titles, cyan icons
  CARD_THEME: "border_radius=14&bg_color=0D1117&border_color=30363D&title_color=A78BFA&icon_color=22D3EE&text_color=C9D1D9"

jobs:
  cards:
    name: Card ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stats
            card: stats
            options: "show_icons=true&include_all_commits=true&count_private=true&show=prs_merged,reviews&rank_icon=github&ring_color=8B5CF6&card_width=480"
          - name: pin-project-management-backend
            card: pin
            options: "repo=project-management-backend&description_lines_count=2"
          - name: pin-tour-booking-application
            card: pin
            options: "repo=tour-booking-application&description_lines_count=2"
          - name: pin-subscription-tracker
            card: pin
            options: "repo=subscription-tracker&description_lines_count=2"
          - name: pin-mohammed-ferwana-portfolio
            card: pin
            options: "repo=mohammed-ferwana-portfolio&description_lines_count=2"
    steps:
      - name: Generate ${{ matrix.name }}.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: ${{ matrix.card }}
          options: ${{ matrix.options }}&${{ env.CARD_THEME }}
          path: dist/${{ matrix.name }}.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: card-${{ matrix.name }}
          path: dist/${{ matrix.name }}.svg
          if-no-files-found: error
          retention-days: 1

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#161B22,#2E1065,#5B21B6,#8B5CF6,#C4B5FD
            dist/snake-light.svg?color_snake=#0891B2&color_dots=#EBEDF0,#DDD6FE,#A78BFA,#7C3AED,#4C1D95

      - uses: actions/upload-artifact@v4
        with:
          name: snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to output branch
    needs: [cards, snake] # publish only when every card succeeded, so a bad run never replaces good images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List generated files
        run: ls -la dist

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(profile): refresh README cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
