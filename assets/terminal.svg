<text class="ln" x="28" y="270" style="animation-delay:3.56s"><tspan fill="#8B949E">  </tspan><tspan fill="#C4B5FD">"cgpa"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#FBBF24">93.3</tspan><tspan fill="#8B949E">,</tspan></text>
<text class="ln" x="28" y="295" style="animation-delay:3.70s"><tspan fill="#8B949E">  </tspan><tspan fill="#C4B5FD">"stack"</tspan><tspan fill="#8B949E">: [</tspan><tspan fill="#67E8F9">"Node.js"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#67E8F9">"Express"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#67E8F9">"MongoDB"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#67E8F9">"PostgreSQL"</tspan><tspan fill="#8B949E">],</tspan></text>
