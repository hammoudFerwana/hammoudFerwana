 </tspan><tspan class="ch" style="animation-delay:2.085s">|</tspan><tspan class="ch" style="animation-delay:2.130s"> </tspan><tspan class="ch" style="animation-delay:2.175s">j</tspan><tspan class="ch" style="animation-delay:2.220s">q</tspan></tspan></text>
