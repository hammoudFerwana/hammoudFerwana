<svg xmlns="http://www.w3.org/2000/svg" width="900" height="398" viewBox="0 0 900 398" role="img" aria-labelledby="t d">
<title id="t">Sawn claim lifecycle</title>
<desc id="d">Finite state machine of an insurance claim in Sawn: NEW, PENDING_ACCEPTANCE, ASSIGNED, IN_PROGRESS, SUBMITTED, UNDER_REVIEW, then APPROVED and CLOSED, or REJECTED, or CORRECTION_REQUIRED which loops back to IN_PROGRESS.</desc>
<defs>
  <linearGradient id="fsm-border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="0.5" stop-color="#30363D"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <radialGradient id="fsm-glow" cx="0.85" cy="0" r="0.7">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fsm-glow2" cx="0.05" cy="1" r="0.6">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient><marker id="ah-8B5CF6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker><marker id="ah-FBBF24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker><marker id="ah-F87171" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
  <filter id="fsm-blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .ttl { font-size: 13px; fill: #8B949E; letter-spacing: 0.08em; }
  .sn { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-weight: 600; }
  .el { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; fill: #8B949E; }
  .st { fill: #161B22; stroke-width: 1.3; }
  .hp { animation: lit 9.6s ease-out infinite both; }
  @keyframes lit {
    0% { fill: #161B22; }
    2% { fill: #2A1F4A; stroke: #A78BFA; }
    11% { fill: #1E1833; stroke: #8B5CF6; }
    20%, 100% { fill: #161B22; stroke: #30363D; }
  }
  
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
<rect x="1" y="1" width="898" height="396" rx="14" fill="#0D1117" stroke="url(#fsm-border)" stroke-width="1.5"/>
<rect x="1" y="1" width="898" height="396" rx="14" fill="url(#fsm-glow)"/>
<rect x="1" y="1" width="898" height="396" rx="14" fill="url(#fsm-glow2)"/>
<text x="22" y="38" class="ttl">SAWN · CLAIM LIFECYCLE</text>
<text x="878" y="38" text-anchor="end" class="ttl" style="letter-spacing:0">10 states · role-guarded transitions</text>
<line class="ed" x1="158" y1="108.0" x2="199" y2="108.0" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#ah-8B5CF6)"/><text x="178.5" y="99.0" text-anchor="middle" class="el">assign</text><line class="ed" x1="339" y1="108.0" x2="380" y2="108.0" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#ah-8B5CF6)"/><text x="359.5" y="99.0" text-anchor="middle" class="el">accept</text><line class="ed" x1="520" y1="108.0" x2="561" y2="108.0" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#ah-8B5CF6)"/><text x="540.5" y="99.0" text-anchor="middle" class="el">start</text><line class="ed" x1="701" y1="108.0" x2="742" y2="108.0" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#ah-8B5CF6)"/><text x="721.5" y="99.0" text-anchor="middle" class="el">submit</text><line class="ed" x1="813.0" y1="132" x2="813.0" y2="192" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#ah-8B5CF6)"/><text x="841.0" y="167.0" text-anchor="middle" class="el">review</text><line class="ed" x1="744" y1="218.0" x2="703" y2="218.0" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah-FBBF24)"/><text x="722.5" y="209.0" text-anchor="middle" class="el">fix</text><line class="ed" x1="632.0" y1="194" x2="632.0" y2="134" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah-FBBF24)"/><text x="602.0" y="167.0" text-anchor="middle" class="el">resume</text><line class="ed" x1="813.0" y1="242" x2="813.0" y2="302" stroke="#F87171" stroke-width="1.6" marker-end="url(#ah-F87171)"/><text x="839.0" y="277.0" text-anchor="middle" class="el">reject</text><line class="ed" x1="764" y1="242" x2="685" y2="302" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#ah-8B5CF6)"/><text x="701" y="289.0" text-anchor="middle" class="el">approve</text><line class="ed" x1="563" y1="328.0" x2="522" y2="328.0" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#ah-8B5CF6)"/><text x="541.5" y="319.0" text-anchor="middle" class="el">close</text>
<rect class="st hp" x="22" y="86" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:0.0s"/><text x="89.0" y="112.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:12px">NEW</text><rect class="st hp" x="203" y="86" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:1.0s"/><text x="270.0" y="112.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:10.5px">PENDING_ACCEPTANCE</text><rect class="st hp" x="384" y="86" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:2.0s"/><text x="451.0" y="112.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:12px">ASSIGNED</text><rect class="st hp" x="565" y="86" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:3.0s"/><text x="632.0" y="112.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:12px">IN_PROGRESS</text><rect class="st hp" x="746" y="86" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:4.0s"/><text x="813.0" y="112.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:12px">SUBMITTED</text><rect class="st" x="565" y="196" width="134" height="44" rx="9" stroke="#FBBF24" stroke-dasharray="4 3"/><text x="632.0" y="222.0" text-anchor="middle" class="sn" fill="#FBBF24" style="font-size:10.5px">CORRECTION_REQUIRED</text><rect class="st hp" x="746" y="196" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:5.0s"/><text x="813.0" y="222.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:12px">UNDER_REVIEW</text><rect class="st hp" x="384" y="306" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:7.0s"/><rect x="388" y="310" width="126" height="36" rx="6" fill="none" stroke="#30363D" stroke-opacity="0.6"/><text x="451.0" y="332.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:12px">CLOSED</text><rect class="st hp" x="565" y="306" width="134" height="44" rx="9" stroke="#30363D" style="animation-delay:6.0s"/><text x="632.0" y="332.0" text-anchor="middle" class="sn" fill="#E6EDF3" style="font-size:12px">APPROVED</text><rect class="st" x="746" y="306" width="134" height="44" rx="9" stroke="#F87171"/><rect x="750" y="310" width="126" height="36" rx="6" fill="none" stroke="#F87171" stroke-opacity="0.6"/><text x="813.0" y="332.0" text-anchor="middle" class="sn" fill="#F87171" style="font-size:12px">REJECTED</text>
<g>
  <circle r="8" fill="#8B5CF6" filter="url(#fsm-blur)" opacity="0.75">
    <animateMotion dur="9.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.1475;0.2951;0.4426;0.5902;0.6798;0.8525;1.0000;1" keyTimes="0.0000;0.1042;0.2083;0.3125;0.4167;0.5208;0.6250;0.7292;1" path="M89.0,108.0 L270.0,108.0 L451.0,108.0 L632.0,108.0 L813.0,108.0 L813.0,218.0 L632.0,328.0 L451.0,328.0"/>
  </circle>
  <circle r="3.5" fill="#C4B5FD">
    <animateMotion dur="9.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.1475;0.2951;0.4426;0.5902;0.6798;0.8525;1.0000;1" keyTimes="0.0000;0.1042;0.2083;0.3125;0.4167;0.5208;0.6250;0.7292;1" path="M89.0,108.0 L270.0,108.0 L451.0,108.0 L632.0,108.0 L813.0,108.0 L813.0,218.0 L632.0,328.0 L451.0,328.0"/>
  </circle>
</g>
<text x="22" y="376" class="el" style="font-size:11px"><tspan fill="#A78BFA">■</tspan> happy path   <tspan fill="#FBBF24">■</tspan> correction loop   <tspan fill="#F87171">■</tspan> rejected   <tspan fill="#8B949E">▣ terminal state</tspan></text>
<text x="878" y="376" text-anchor="end" class="el" style="font-size:11px">atomic findOneAndUpdate on organizationId + expected status</text>
</svg>
